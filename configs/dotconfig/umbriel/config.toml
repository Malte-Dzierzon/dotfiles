# Umbriel config — portiert aus hyprland.conf (2026-09-30)
# Ref: https://docs.noctalia.dev/umbriel/
# Validieren: umbriel config validate

  [general]
  autostart = [
    "noctalia",
    "walker --gapplication-service",
    "/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1",
    "wlsunset -l 52.5 -L 13.4",
  ]
  show_cheatsheet = true

  # Laptop-Panel kleiner als Niri-1.0 (mehr Platz, noch lesbar)
  [output.eDP-1]
  scale = 1.15

  [input.keyboard]
  layout = "de"
  repeat_rate = 40
  repeat_delay = 250
  numlock_toggle = true

  [input.focus]
  follows_mouse = true

  # Wie Niri: natural-scroll an (invertiert)
  [input.touchpad]
  tap = true
  natural_scroll = true
  click_method = "clickfinger"
  scroll_factor = 0.4
  disable_while_typing = true

[input.cursor]
theme = "Bibata-Modern-Classic"
size = 16
hardware_cursor = false
hide_when_typing = true

  [appearance]
  border_width = 1
  outer_border_width = 0
  corner_radius = 0

  # Blur: weich aber performant — optimiert (ein Hintergrund-Blur pro Output),
  # mehr Passes für samtige Flächen, leichte Abdunklung für Lesbarkeit
  [appearance.blur]
  enabled = true
  optimized = true
  passes = 2
  radius = 4
  noise = 0.02
  brightness = 0.9
  contrast = 1.0
  saturation = 1.0

  # Schatten an für Tiefenstaffelung (nur floating, tiled bleibt clean)
  [appearance.shadow]
  enabled = true
  softness = 18
  offset_x = 0
  offset_y = 4

  [colors.border]
  focused = "#FFB690FF"
  unfocused = "#18120FFF"

    [layout]
    mode = "dwindle"
    gap = 6
    extent_presets = [0.333, 0.5, 0.667]

  [layout.scrolling]
  default_extent_fraction = 0.5

  # Leichter Blur: optimiert (gecacht, billig), kleiner Radius,
  # Transparenz dezent erhöht damit weniger „Milchglas"
  [[window_rule]]
  opacity = 0.85
  blur = true
  blur_optimized = true
  shadow = false

  # Noctalia-Shell: floating + normaler Blur (optimiert, kein Xray)
  [[window_rule]]
  match.app_id = "^dev.noctalia.Noctalia$"
  default_floating = true
  default_floating_size_px = { width = 1020, height = 900 }
  blur = true
  blur_optimized = false

  [[layer_rule]]
  match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*|window-switcher)$"
  blur = true
  blur_ignore_alpha = 0.5
  blur_popups = true
  blur_optimized = false

[keybinds]
# --- Apps (aus hyprland.conf portiert) ---
"Mod+Return" = { action = "spawn:foot", repeat = false }
"Mod+Alt+Return" = 'spawn:foot bash -c "tmux attach || tmux new -s Work"'
"Mod+Space" = "spawn:noctalia msg panel-toggle launcher"
"Mod+D" = "spawn:walker"
"Mod+E" = "spawn:zeditor"
"Mod+Shift+Return" = "spawn:zen"
"Mod+Shift+B" = "spawn:zen"
"Mod+Shift+F" = "spawn:nautilus --new-window"
"Mod+Shift+O" = "spawn:obsidian"
"Mod+Shift+C" = "spawn:zen --new-window https://chatgpt.com"
"Mod+Shift+Y" = "spawn:zen --new-window https://youtube.com/"
"Mod+Shift+W" = "spawn:zen --new-window https://web.whatsapp.com/"
"Mod+Shift+P" = "spawn:zen --new-window https://photos.google.com/"
"Mod+A" = "spawn:foot -a tui-omp -T omp /home/xealom/.local/bin/omp"
  "Mod+N" = "spawn:foot bash -c 'sudoedit /etc/nixos/configuration.nix'"
"Mod+Shift+Alt+B" = "spawn:zen --private-window"
"Mod+Shift+D" = "spawn:foot lazydocker || foot docker ps"
"Mod+Ctrl+T" = "spawn:foot btop"
"Mod+Alt+M" = "spawn:foot kew"
"Mod+Ctrl+Space" = "spawn:noctalia msg panel-toggle wallpaper"
"Mod+Ctrl+Shift+Space" = "spawn:noctalia msg panel-toggle theblackdon/theme-switcher:carousel"
"Mod+Shift+G" = "spawn:noctalia msg panel-toggle xealom/utilmenu:menu"
"Mod+Alt+Space" = "spawn:noctalia msg panel-toggle control-center home"
  "Mod+X" = "spawn:noctalia msg panel-toggle wallpaper"
  "Mod+Shift+Space" = "spawn:noctalia msg bar-toggle"
  "Alt+Space" = "scratchpad-toggle"
  "Alt+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }
  "Alt+Tab" = "spawn:noctalia msg window-switcher"
  "Mod+Tab" = "scratchpad-focus-next"

# --- Fenster ---
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+W" = { action = "window-close", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+V" = { action = "window-toggle-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+R" = "window-cycle-primary-extent"
"Mod+Comma" = "window-consume-left"
"Mod+Period" = "window-consume-right"

# --- Fokus / Move (H/J/K/L + Pfeile) ---
"Mod+H" = "window-focus-left"
"Mod+L" = "window-focus-right"
"Mod+K" = "window-focus-up"
"Mod+J" = "window-focus-down"
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up" = "window-focus-up"
"Mod+Down" = "window-focus-down"
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+L" = "column-move-right"
"Mod+Shift+K" = "window-move-up"
"Mod+Shift+J" = "window-move-down"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Right" = "column-move-right"
"Mod+Shift+Up" = "window-move-up"
  "Mod+Shift+Down" = "window-move-down"
  "Mod+O" = { action = "overview-toggle", repeat = false }
  "Mod+Shift+T" = "workspace-set-layout:toggle"
  "Mod+F1" = "cheatsheet-toggle"

# --- Workspaces 1-9 ---
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"

# --- Session / Screenshots ---
"Mod+Escape" = "spawn:noctalia msg panel-toggle session"
  "Mod+Ctrl+S" = { action = "spawn:mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +%F-%H%M%S).png", repeat = false }
  "Print" = { action = "spawn:mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +%F-%H%M%S).png", repeat = false }
  "Shift+Print" = { action = 'spawn:mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%F-%H%M%S).png', repeat = false }

# --- Media-Tasten (Lautstärke, Player, Helligkeit) ---
"XF86AudioRaiseVolume" = 'spawn:sh -c "wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+ -l 1.0"'
"XF86AudioLowerVolume" = 'spawn:sh -c "wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-"'
"XF86AudioMute" = 'spawn:sh -c "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"'
"XF86AudioMicMute" = 'spawn:sh -c "wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"'
"XF86AudioPlay" = 'spawn:sh -c "playerctl play-pause"'
"XF86AudioStop" = 'spawn:sh -c "playerctl stop"'
"XF86AudioPrev" = 'spawn:sh -c "playerctl previous"'
"XF86AudioNext" = 'spawn:sh -c "playerctl next"'
"XF86MonBrightnessUp" = 'spawn:brightnessctl --class=backlight set +10%'
"XF86MonBrightnessDown" = 'spawn:brightnessctl --class=backlight set 10%-'

[environment]
QT_QPA_PLATFORMTHEME = "qt6ct"

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"
