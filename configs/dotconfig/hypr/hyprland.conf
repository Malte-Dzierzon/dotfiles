# Hyprland standalone config (kein Omarchy), portiert aus Malte-Dzierzon/config-data + niri-Binds dieser Maschine.
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,16
env = HYPRCURSOR_SIZE,16-

# --- Autostart ---
exec-once = noctalia
exec-once = walker --gapplication-service
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wlsunset -l 52.5 -L 13.4

# --- Input: de-Layout, Touchpad ---
input {
  kb_layout = de
  repeat_rate = 40
  repeat_delay = 250
  follow_mouse = 1
  touchpad {
    natural_scroll = no
    clickfinger_behavior = true
    scroll_factor = 0.4
    disable_while_typing = true
  }
}

# --- Look: eckig, gaps 6 wie niri ---
general {
  gaps_in = 6
  gaps_out = 6
  border_size = 1
  col.active_border = rgb(ffb690)
  col.inactive_border = rgb(18120f)
  layout = dwindle
}
decoration {
  rounding = 0
  shadow:enabled = false
  blur:enabled = true
  blur:size = 5
  blur:passes = 2
  blur:new_optimizations = true
  blur:popups = true
  dim_inactive = true
  dim_strength = 0.10
}
animations {
  enabled = yes
  bezier = omarchyEase, 0.22, 1, 0.36, 1
  bezier = omarchyFade, 0.4, 0, 0.2, 1
  animation = windowsIn, 1, 4, omarchyEase, popin 80%
  animation = windowsOut, 1, 2.4, omarchyFade, popin 80%
  animation = windowsMove, 1, 4, omarchyEase
  animation = fadeSwitch, 1, 2.2, omarchyFade
  animation = fade, 1, 3, omarchyFade
  animation = layersIn, 1, 5, omarchyFade, fade
  animation = layersOut, 1, 4, omarchyFade, fade
  animation = border, 1, 5, omarchyEase
  animation = workspaces, 1, 5, omarchyFade, fade
  animation = specialWorkspace, 1, 3, omarchyEase, slidevert
}
cursor {
  no_hardware_cursors = true
  hide_on_key_press = true
}

# --- Binds (SUPER = Win), gespiegelt aus niri config.kdl ---
$term = foot
$menu = /home/xealom/.config/utilmenu2/menu.sh
$noct = noctalia msg

bind = SUPER, RETURN, exec, $term
bind = SUPER ALT, RETURN, exec, $term bash -c "tmux attach || tmux new -s Work"
bind = SUPER, SPACE, exec, $noct panel-toggle launcher
bind = SUPER, D, exec, walker
bind = SUPER, E, exec, zeditor
bind = SUPER SHIFT, RETURN, exec, zen
bind = SUPER SHIFT, B, exec, zen
bind = SUPER SHIFT, F, exec, nautilus --new-window
bind = SUPER SHIFT, O, exec, obsidian
bind = SUPER SHIFT, C, exec, zen --new-window https://chatgpt.com
bind = SUPER SHIFT, Y, exec, zen --new-window https://youtube.com/
bind = SUPER SHIFT, W, exec, zen --new-window https://web.whatsapp.com/
bind = SUPER SHIFT, P, exec, zen --new-window https://photos.google.com/
bind = SUPER, A, exec, foot -a tui-omp -T omp /home/xealom/.local/bin/omp
bind = SUPER, N, exec, foot bash -c "SUDO_EDITOR='/run/current-system/sw/bin/zeditor --wait' sudoedit /etc/nixos/configuration.nix"
bind = SUPER SHIFT ALT, B, exec, zen --private-window
bind = SUPER SHIFT, D, exec, foot lazydocker || foot docker ps
bind = SUPER CTRL, T, exec, foot btop
bind = SUPER ALT, M, exec, foot kew
bind = SUPER CTRL, SPACE, exec, $noct panel-toggle wallpaper
bind = SUPER CTRL SHIFT, SPACE, exec, $noct panel-toggle theblackdon/theme-switcher:carousel

bind = SUPER SHIFT, G, exec, $noct panel-toggle xealom/utilmenu:menu
bind = SUPER ALT, SPACE, exec, $noct panel-toggle control-center home
bind = SUPER, X, exec, $noct panel-toggle wallpaper
bind = SUPER, ESCAPE, exec, $noct panel-toggle session
bind = SUPER SHIFT, SPACE, exec, $noct bar-toggle
bind = SUPER, Q, killactive,
bind = SUPER, W, killactive,
bind = SUPER, F, fullscreen,
bind = SUPER, V, togglefloating,
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d

# Workspaces 1-9
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# Screenshots -> ~/Pictures/Screenshots/
bind = , PRINT, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +%F-%H%M%S).png
bind = SHIFT, PRINT, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%F-%H%M%S).png

# For Noctalia Color templates
source = ~/.config/hypr/noctalia.conf
