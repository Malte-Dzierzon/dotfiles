theme = "noctalia"
[providers.sets.utilmenu]
default = ["menus:utilsearch", "menus:utilmenu"]
empty = ["menus:utilmenu"]

# Nativ: menus:open navigiert (submenu), default führt aus.
# Return = default-Aktion des Eintrags (open ODER run, je nach Entry-Typ).
[providers.actions]
"menus:utilmenu" = [
  { action = "menus:open", bind = "Return", default = true, after = "ClearReload" },
  { action = "menus:open", bind = "Right", default = true, after = "ClearReload" },
  { action = "menus:parent", bind = "Left", after = "Nothing" },
  { action = "menus:parent", bind = "BackSpace", after = "ClearReload" },
  { action = "menus:parent", bind = "Escape", after = "ClearReload" },
]
