# ============================================================
# MangoWM — Hyprland/Community-Port
# Laptop / Touchpad / Tablet friendly
# ============================================================

# ============================================================
# Layout — Dwindle / BSP
# ============================================================

# Hyprland-nahes rekursives Tiling
tagrule=id:*,layout_name:dwindle

# Dwindle <-> Monocle
circle_layout=dwindle,monocle

# Dwindle-Verhalten
new_is_master=0
default_mfact=0.55
default_nmaster=1
smartgaps=0

dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=1


# ============================================================
# Look
# ============================================================

gappih=4
gappiv=4
gappoh=6
gappov=6

borderpx=1
border_radius=0
no_radius_when_single=1
no_border_when_single=0

rootcolor=0x141414ff
bordercolor=0x3d3d3dff
focuscolor=0x8a8a8aff
urgentcolor=0xad401fff

# Kein Shadow-Look
shadows=0
layer_shadows=0
shadow_only_floating=0

# State-Farben
maximizescreencolor=0x8a8a8aff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

cursor_size=24
cursor_theme=Adwaita


# ============================================================
# Opacity + Blur
# ============================================================

# Voll deckend — kein Fake-Dim
focused_opacity=0.9
unfocused_opacity=0.6

blur=1
blur_layer=1
blur_optimized=1

blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2


# ============================================================
# Animationen — Community / Calm
# ============================================================

animations=1
layer_animations=1

# Fenster weich herein-/herausgleiten
animation_type_open=slide
animation_type_close=slide

# UI-Layer sauber und weniger aufdringlich
layer_animation_type_open=fade
layer_animation_type_close=fade

animation_fade_in=1
animation_fade_out=1

# Horizontale Tag-Richtung
tag_animation_direction=1

# Zoom-Werte bleiben für Zoom-Regeln verfügbar
zoom_initial_ratio=0.90
zoom_end_ratio=1.0

# Sauberer Fade, kein hartes Ein-/Ausblenden
fadein_begin_opacity=0.0
fadeout_begin_opacity=1.0


# --- etwas langsamer als typische Community-Presets ---
# dadurch ruhiger auf 144/170 Hz und angenehmer auf Touchpad
animation_duration_open=520
animation_duration_move=460
animation_duration_close=340

# kleine, aber nicht träge Tag-Transition
animation_duration_tag=280

# dezente Fokus-Transition
animation_duration_focus=220


# --- Community-artige, weiche Ease-Out-Kurven ---

animation_curve_open=0.16,1.0,0.30,1.0
animation_curve_close=0.40,0.0,0.20,1.0
animation_curve_move=0.20,1.0,0.30,1.0
animation_curve_tag=0.18,1.0,0.30,1.0
animation_curve_focus=0.40,0.0,0.20,1.0

animation_curve_opafadein=0.16,1.0,0.30,1.0
animation_curve_opafadeout=0.40,0.0,0.60,1.0


# ============================================================
# Overview
# ============================================================

enable_hotarea=0
hotarea_size=10
hotarea_corner=2

ov_tab_mode=0

overviewgappi=8
overviewgappo=40


# ============================================================
# Input — Laptop / Touchpad
# ============================================================

xkb_rules_layout=de

numlockon=1

# Community-nahe Tastaturabstimmung
repeat_rate=50
repeat_delay=300

tap_to_click=1
tap_and_drag=1

# Kein Sticky Drag
drag_lock=0

trackpad_natural_scrolling=0
disable_while_typing=0

click_method=2
scroll_method=1

left_handed=0
middle_button_emulation=0

swipe_min_threshold=1

mouse_natural_scrolling=0

sloppyfocus=1
warpcursor=1

drag_tile_to_tile=1
enable_floating_snap=0

focus_on_activate=1
focus_cross_monitor=0
focus_cross_tag=0

xwayland_persistence=1


# ============================================================
# Environment
# ============================================================

env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=QT_QPA_PLATFORM,wayland
env=NIXOS_OZONE_WL,1


# ============================================================
# Display Scaling
# ============================================================

# 125 % für native Wayland-Anwendungen.
# Matcht alle Monitore über Regex.
#
# Falls du später nur einen Monitor skalieren willst:
# monitorrule=name:^eDP-1$,scale:1.25
#
monitorrule=name:.*,scale:1.25


# ============================================================
# Autostart
# ============================================================

exec-once=/home/xealom/.nix-profile/bin/noctalia


# ============================================================
# Binds
# ============================================================

# Reload
bind=SUPER,r,reload_config

# Launcher & Menüs
bind=SUPER,space,spawn,/home/xealom/.nix-profile/bin/noctalia msg panel-toggle launcher
bind=SUPER+ALT,space,spawn,/home/xealom/.nix-profile/bin/noctalia msg panel-toggle control-center home
bind=SUPER,d,spawn,walker
bind=SUPER,a,spawn,foot -a tui-omp -T omp /home/xealom/.local/bin/omp
bind=SUPER,x,spawn,/home/xealom/.nix-profile/bin/noctalia msg panel-toggle wallpaper
bind=SUPER,Escape,spawn,/home/xealom/.nix-profile/bin/noctalia msg panel-toggle session
bind=SUPER+SHIFT,space,spawn,/home/xealom/.nix-profile/bin/noctalia msg bar-toggle
bind=SUPER+CTRL,space,spawn,/home/xealom/.nix-profile/bin/noctalia msg panel-toggle wallpaper
bind=SUPER+SHIFT+CTRL,space,spawn,/home/xealom/.nix-profile/bin/noctalia msg panel-toggle control-center


# ============================================================
# Apps
# ============================================================

bind=SUPER,Return,spawn,foot
bind=SUPER+ALT,Return,spawn_shell,foot bash -c "tmux attach || tmux new -s Work"

bind=SUPER,e,spawn,zeditor

bind=SUPER,n,spawn_shell,foot bash -c "SUDO_EDITOR='/run/current-system/sw/bin/zeditor --wait' sudoedit /etc/nixos/configuration.nix"

bind=SUPER+SHIFT,Return,spawn,zen
bind=SUPER+SHIFT,b,spawn,zen
bind=SUPER+SHIFT+ALT,b,spawn,zen --private-window

bind=SUPER+SHIFT,f,spawn,nautilus --new-window

bind=SUPER+SHIFT,d,spawn_shell,foot lazydocker || foot docker ps

bind=SUPER+SHIFT,o,spawn_shell,obsidian || xdg-open obsidian:// 2>/dev/null || notify-send 'Obsidian nicht installiert'

bind=SUPER+CTRL,t,spawn,foot btop

bind=SUPER+SHIFT,c,spawn,zen --new-window https://chatgpt.com
bind=SUPER+SHIFT,y,spawn,zen --new-window https://youtube.com/
bind=SUPER+SHIFT,w,spawn,zen --new-window https://web.whatsapp.com/
bind=SUPER+SHIFT,p,spawn,zen --new-window https://photos.google.com/

bind=SUPER+ALT,m,spawn,foot kew


# ============================================================
# Fenster schließen / Lock / Quit
# ============================================================

bind=SUPER,w,killclient
bind=SUPER,q,killclient

bind=SUPER+ALT,l,spawn,swaylock

bind=SUPER+SHIFT,e,quit
bind=CTRL+ALT,Delete,quit


# ============================================================
# Hardware
# ============================================================

# l-Flag = auch im Lock-Screen

bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioStop,spawn,playerctl stop
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioNext,spawn,playerctl next

bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl --class=backlight set +10%
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl --class=backlight set 10%-


# ============================================================
# Overview
# ============================================================

bind=SUPER,o,toggleoverview


# ============================================================
# Fokus bewegen
# ============================================================

bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right


# ============================================================
# Fenster tauschen
# ============================================================

bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Right,exchange_client,right

bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,j,exchange_client,down
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,l,exchange_client,right


# ============================================================
# Monitore
# ============================================================

bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Down,focusmon,down
bind=SUPER+SHIFT,Up,focusmon,up
bind=SUPER+SHIFT,Right,focusmon,right

bind=SUPER+SHIFT,h,focusmon,left
bind=SUPER+SHIFT,j,focusmon,down
bind=SUPER+SHIFT,k,focusmon,up
bind=SUPER+SHIFT,l,focusmon,right

bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Down,tagmon,down
bind=SUPER+SHIFT+CTRL,Up,tagmon,up
bind=SUPER+SHIFT+CTRL,Right,tagmon,right

bind=SUPER+SHIFT+CTRL,h,tagmon,left
bind=SUPER+SHIFT+CTRL,j,tagmon,down
bind=SUPER+SHIFT+CTRL,k,tagmon,up
bind=SUPER+SHIFT+CTRL,l,tagmon,right


# ============================================================
# Tags 1–9
# ============================================================

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0

bind=SUPER,u,viewtoleft_have_client
bind=SUPER,i,viewtoright_have_client

bind=SUPER+CTRL,u,tagtoleft,0
bind=SUPER+CTRL,i,tagtoright,0

bind=SUPER,Tab,view,-1


# ============================================================
# Tag Scroll
# ============================================================

axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


# ============================================================
# Gesten
# ============================================================

# 4-Finger = Overview / Tag
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client

# 3-Finger = Fokus
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down


# ============================================================
# Layout Controls
# ============================================================

bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,m,togglemaximizescreen

bind=SUPER+SHIFT,n,switch_layout

bind=SUPER,t,togglefloating
bind=SUPER,c,centerwin

bind=SUPER,minus,setmfact,-0.05
bind=SUPER,equal,setmfact,+0.05


# ============================================================
# Screenshots
# ============================================================

bind=NONE,Print,spawn_shell,grim -g "$(slurp -d)" ~/Pictures/Screenshots/$(date +%F_%H-%M-%S).png && notify-send 'Screenshot gespeichert'

bind=CTRL,Print,spawn_shell,grim ~/Pictures/Screenshots/$(date +%F_%H-%M-%S).png && notify-send 'Screenshot gespeichert'

bind=ALT,Print,spawn_shell,grim -g "$(slurp -d)" - | wl-copy && notify-send 'Screenshot in Zwischenablage'


# ============================================================
# Maus
# ============================================================

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize


# ============================================================
# Window Rules
# ============================================================

# GTK File Picker freischwebend
windowrule=isfloating:1,appid:xdg-desktop-portal-gtk
