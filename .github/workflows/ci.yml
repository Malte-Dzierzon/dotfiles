name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: No secrets in repo
        run: |
          A='ghp_[A-Za-z0-9]'; A="${A}{20,}"
          B='github_'; B="${B}pat_"
          C='xox[bpas]-'
          D='sk-(live|ant)-'
          E='-----BEGIN '; E="${E}(RSA |OPENSSH |PGP )?PRIVATE KEY"
          ! git grep -n -iE "$A|$B|$C|$D|$E" -- . || { echo "possible secret found"; exit 1; }
          # hardware-configuration.nix is host-specific and must stay untracked;
          # home/.local/state/noctalia/settings.toml is intentionally tracked (theme source).
          ! git ls-files | grep -E "hosts/nixos/hardware-configuration\.nix$|/credentials|/secrets|\.age$" || { echo "host-specific or secret file tracked"; exit 1; }

      - name: Shellcheck + format
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck shfmt desktop-file-utils > /dev/null
          shellcheck scripts/*.sh
          shfmt -d -i 2 scripts/
          nix fmt -- --check .
          git diff --check
          bash scripts/install.sh --dry-run --no-rebuild --no-user-pkgs
          # portability: no baked store paths, no foreign home dirs, no /usr on NixOS
          ! grep -rn --exclude-dir=.git --exclude=flake.lock '/nix/store/' -- . || { echo 'baked /nix/store path'; exit 1; }
          ! grep -rn --exclude-dir=.git '/home/[a-z0-9]\+/\(\.nix-profile\|Downloads\|Projects\)' -- configs home desktops modules hosts scripts || { echo 'machine-specific home path'; exit 1; }
          # .desktop files valid
          find home/.local/share/applications -name '*.desktop' -exec desktop-file-validate {} +

      - name: Evaluate both desktops
        run: |
          cp hosts/nixos/hardware-configuration.nix.example hosts/nixos/hardware-configuration.nix
          git add -f hosts/nixos/hardware-configuration.nix
          nix eval --no-allow-import-from-derivation .#nixosConfigurations.nixos.config.system.build.toplevel.outPath --apply builtins.toString
          sed -i 's/desktop = "niri";/desktop = "umbriel";/' hosts/nixos/settings.nix
          nix eval --no-allow-import-from-derivation .#nixosConfigurations.nixos.config.system.build.toplevel.outPath --apply builtins.toString

      - name: Flake check
        run: nix flake check --no-build .
